name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libglib2.0-dev
      # The unit tests only need these; the full runtime deps need a desktop session.
      - run: pip install evdev dbus-python pytest
      - run: python -m pytest
        env:
          PYTHONPATH: src
